  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
  <script src="js/constants.js"></script>
  <script src="js/colors.js"></script>
  <script src="js/wind.js"></script>
  <script src="js/fetch.js"></script>
  <script src="js/main.js"></script>
  <script src="js/theme.js" defer></script>

  <script>
  (function() {
    'use strict';

    // ── Constants ──
    const DEFAULT_ZOOM = 14;
    const GRID_CELL_SIZE = 0.0004; // degrees — matches compute engine spacing

    // ── Theme-aware basemap (light_all / dark_matter) ──
    const BASEMAPS = {
      light: 'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
      dark: 'https://{s}.basemaps.cartocdn.com/dark_matter/{z}/{x}/{y}{r}.png'
    };
    let tileLayer = null;

    function setBasemap() {
      const dark = document.documentElement.classList.contains('dark');
      const url = dark ? BASEMAPS.dark : BASEMAPS.light;
      if (!tileLayer) {
        tileLayer = L.tileLayer(url, {
          maxZoom: 19,
          attribution: '&copy; OpenStreetMap contributors &copy; CARTO'
        }).addTo(map);
      } else {
        tileLayer.setUrl(url);
      }
    }

    // ── Lake state ──
    let currentLake = null;
    let manifest = null;

    // ── Dynamic constants ──
    function getLakeCenter() {
      if (currentLake) return [currentLake.center_lat, currentLake.center_lon];
      return [45.491, -93.499]; // fallback Blue Lake
    }

    function getStaticUrl() {
      if (currentLake) return 'data/lakes/' + currentLake.id + '/lake_static.json';
      return 'data/lake_static.json'; // backward compat fallback
    }

    // ── Selection state ──
    var selectedCell = null;

    // ── Impact classification ──
    function classifyImpact(score) {
      if (score == null || isNaN(score)) return 'low';
      if (score > 0.45) return 'high';
      if (score > 0.30) return 'medium';
      return 'low';
    }

    function impactColor(category) {
      const colors = {
        high:   '#ea2261',
        medium: '#f59e0b',
        low:    '#15be53'
      };
      return colors[category] || '#15be53';
    }

    function impactLabel(category) {
      const labels = { high: 'High Impact', medium: 'Moderate', low: 'Low' };
      return labels[category] || 'Low';
    }

    function impactWeight(category) {
      const weights = { high: 8, medium: 6, low: 4 };
      return weights[category] || 4;
    }

    // Ray-casting point-in-polygon test
    function pointInPolygon(lat, lon, polygon) {
      let inside = false;
      for (let i = 0, j = polygon.length - 1; i < polygon.length; j = i++) {
        // polygon coords are [lon, lat] from KML
        const xi = polygon[i][0], yi = polygon[i][1];
        const xj = polygon[j][0], yj = polygon[j][1];
        const intersect = ((yi > lat) !== (yj > lat))
          && (lon < (xj - xi) * (lat - yi) / (yj - yi) + xi);
        if (intersect) inside = !inside;
      }
      return inside;
    }

    // ── State ──
    let map = null;
    let lakePolygonLayer = null;
    let geoJsonOutlineLayer = null;
    let gridHeatmapLayers = [];
    let landCoverLayer = null;  // ponytail: WMS toggle, in initMap not here
    let data = null;
    let staticData = null;
    let turfLakePolygon = null;  // cached Turf polygon for grid clipping
    let currentTimeIdx = -1;

    // ── DOM refs ──
    const $loadingBar = document.getElementById('loadingBar');
    const $loadingSpinner = document.getElementById('loadingSpinner');
    const $windSpeed = document.getElementById('windSpeed');
    const $windGust = document.getElementById('windGust');
    const $windDir = document.getElementById('windDir');
    const $impactBadge = document.getElementById('impactBadge');
    const $timePills = document.getElementById('timePills');
    const $timeBar = document.getElementById('timeBar');
    const $windCard = document.getElementById('windCard');
    const $windCardText = document.getElementById('windCardText');
    const $windArrow = document.getElementById('windArrow');

    // ── Init map ──
    function initMap() {
      map = L.map('map', {
        center: getLakeCenter(),
        zoom: DEFAULT_ZOOM,
        zoomControl: false,
        attributionControl: false
      });

      // Flex-sized container — Leaflet measures lazily, refresh size after layout
      setTimeout(() => map.invalidateSize(), 0);

      // Basemap tile layer (theme-aware)
      setBasemap();

      // Zoom control in bottom-right
      L.control.zoom({ position: 'bottomright' }).addTo(map);

      // Subtle attribution
      L.control.attribution({
        position: 'bottomright',
        prefix: false
      }).addTo(map);

      // NLCD 2021 land cover overlay (WMS, hidden by default)
      landCoverLayer = L.tileLayer.wms('https://www.mrlc.gov/geoserver/mrlc_display/NLCD_2021_Land_Cover_L48/wms', {
        layers: 'NLCD_2021_Land_Cover_L48',
        format: 'image/png',
        transparent: true,
        opacity: 0.45,
        attribution: 'NLCD 2021 · USGS/MRLC'
      });
    }

    // ── Toggle land cover overlay ──
    function toggleLandCover() {
      const btn = document.getElementById('landcoverToggle');
      if (!landCoverLayer) return;
      if (map.hasLayer(landCoverLayer)) {
        map.removeLayer(landCoverLayer);
        btn.classList.remove('active');
      } else {
        landCoverLayer.addTo(map);
        btn.classList.add('active');
      }
    }

    // Shoreline impact: mirrors Python compute_shoreline()
    function recomputeShorelineImpact(seg, windDirDeg) {
      // Reconstruct dot product of shore normal and wind vector
      const p1 = seg.segment[0];
      const p2 = seg.segment[1];
      const dx = p2[0] - p1[0];
      const dy = p2[1] - p1[1];
      const len = Math.sqrt(dx * dx + dy * dy);
      if (len < 1e-12) return 0;

      // Left normal in lat/lon space
      const nx = -dy / len;
      const ny = dx / len;

      // Wind vector (where wind goes): direction_deg + 180
      const goesDeg = (windDirDeg + 180) % 360;
      const rad = goesDeg * Math.PI / 180;
      const wx = Math.sin(rad);  // lon component
      const wy = Math.cos(rad);  // lat component

      const dot = nx * wx + ny * wy;
      // Use midpoint for fetch computation
      const midLat = (p1[1] + p2[1]) / 2;
      const midLon = (p1[0] + p2[0]) / 2;
      const fetchKm = computeDirectionalFetch(midLat, midLon, windDirDeg, data.lake_polygon);
      const normalizedFetch = Math.min(fetchKm / FETCH_CAP_KM, 1.0);
      return Math.max(0, dot) * normalizedFetch;
    }

    // ── Cached Turf lake polygon for grid clipping ──
    function getTurfLakePolygon() {
      if (turfLakePolygon) return turfLakePolygon;
      if (!data || !data.lake_polygon || data.lake_polygon.length < 3) return null;
      // data.lake_polygon is [lon, lat] pairs — already GeoJSON order
      const coords = data.lake_polygon.map(p => [p[0], p[1]]);
      // Close the ring if not already closed
      const first = coords[0], last = coords[coords.length - 1];
      if (first[0] !== last[0] || first[1] !== last[1]) {
        coords.push([first[0], first[1]]);
      }
      turfLakePolygon = turf.polygon([coords]);
      return turfLakePolygon;
    }

    // ── Grid heatmap full redraw with recomputed impact ──
    function redrawGridHeatmap(grid, windSpeedMs, windDirDeg) {
      clearGridHeatmap();

      if (!grid || grid.length === 0) return;

      const lakePolygon = data.lake_polygon;  // [lon, lat] pairs

      grid.forEach(cell => {
        const impactScore = cellImpact(cell, windSpeedMs, windDirDeg, data.lake_polygon);
        const color = gridImpactColor(impactScore);
        const half = GRID_CELL_SIZE / 2;

        // Build cell polygon in GeoJSON [lon, lat] order
        const cellCoords = [
          [cell.lon - half, cell.lat - half],
          [cell.lon + half, cell.lat - half],
          [cell.lon + half, cell.lat + half],
          [cell.lon - half, cell.lat + half],
          [cell.lon - half, cell.lat - half]
        ];
        const cellPoly = turf.polygon([cellCoords]);
        const lakePoly = getTurfLakePolygon();
        if (!lakePoly) return;

        // Clip cell to lake boundary
        const clipped = turf.intersect(cellPoly, lakePoly);
        if (!clipped) return;  // cell entirely outside lake

        // Convert GeoJSON [lon, lat] back to Leaflet [lat, lon]
        const leafletCoords = clipped.geometry.coordinates[0].map(c => [c[1], c[0]]);

        const poly = L.polygon(leafletCoords, {
          color: color,
          weight: 0.5,
          opacity: 0.6,
          fillColor: color,
          fillOpacity: 0.55,
          smoothFactor: 0
        }).addTo(map);

        let tipText = '<strong>Fetch:</strong> ' + ((cell.fetch_km || 0) * 0.621371).toFixed(2) + ' mi<br>'
          + '<strong>Impact:</strong> ' + (impactScore * 100).toFixed(0) + '%';

        // Show wave height estimate for reference
        const waveH = 0.017 * (windSpeedMs * computeShieldFactor(
          cell.shore_distance_m, cell.shore_normal_deg, windDirDeg,
          cell.nlcd_reduction != null ? cell.nlcd_reduction : 0.5
        )) * Math.sqrt((cell.fetch_km || 0) * 1000);
        tipText += '<br><strong>Wave:</strong> ' + (waveH * 3.28084).toFixed(1) + ' ft';

        const shieldFactor = computeShieldFactor(
          cell.shore_distance_m, cell.shore_normal_deg, windDirDeg,
          cell.nlcd_reduction != null ? cell.nlcd_reduction : 0.5
        );
        if (shieldFactor < 0.99) {
          tipText += '<br><strong>Shield:</strong> ' + (shieldFactor * 100).toFixed(0) + '%';
        }
        if (cell.shore_distance_m != null && cell.shore_distance_m < 150) {
          tipText += '<br><strong>Shore:</strong> ' + (cell.shore_distance_m * 3.28084).toFixed(0) + ' ft';
        }

        poly.bindTooltip(tipText,
          { direction: 'top', className: 'grid-tooltip', sticky: true }
        );

        poly.on('click', function() {
          if (selectedCell && selectedCell !== this) {
            selectedCell.setStyle({weight: 0.5, opacity: 0.6, fillOpacity: 0.55});
          }
          this.setStyle({weight: 3, opacity: 1.0, fillOpacity: 0.65});
          this.bringToFront();
          this.openTooltip();
          selectedCell = this;
        });

        gridHeatmapLayers.push(poly);
      });
    }

    // ── Draw lake polygon (thin border outline only) ──
    function drawLakePolygon(coords) {
      if (lakePolygonLayer) map.removeLayer(lakePolygonLayer);

      const latlngs = coords.map(c => [c[1], c[0]]);

      lakePolygonLayer = L.polygon(latlngs, {
        color: '#533afd',
        weight: 2,
        opacity: 0.85,
        fillColor: '#533afd',
        fillOpacity: 0,
        dashArray: null,
        smoothFactor: 0.5
      }).addTo(map);

      // Fit bounds with some padding
      map.fitBounds(lakePolygonLayer.getBounds(), { padding: [100, 100] });
    }

    // ── Add GeoJSON lake outline layer on top of heatmap ──
    function addGeoJsonOutline() {
      if (!currentLake) return;
      if (geoJsonOutlineLayer) map.removeLayer(geoJsonOutlineLayer);

      fetch('data/lakes/' + currentLake.id + '/outline.geojson')
        .then(function(resp) {
          if (!resp.ok) throw new Error('HTTP ' + resp.status);
          return resp.json();
        })
        .then(function(geojson) {
          geoJsonOutlineLayer = L.geoJSON(geojson, {
            style: {
              color: '#3a7cc3',
              weight: 2,
              opacity: 0.85,
              fillColor: '#5b9bd5',
              fillOpacity: 0.0
            }
          }).addTo(map);

          // Bring to front so it renders on top of the heatmap
          geoJsonOutlineLayer.bringToFront();
        })
        .catch(function(err) {
          console.warn('GeoJSON outline failed:', err.message);
        });
    }

    // ── Draw grid heatmap ──
    function clearGridHeatmap() {
      gridHeatmapLayers.forEach(l => map.removeLayer(l));
      gridHeatmapLayers = [];
    }

    function drawGridHeatmap(grid) {
      clearGridHeatmap();

      if (!grid || grid.length === 0) return;

      const lakePolygon = data.lake_polygon;

      grid.forEach(cell => {
        const impactScore = cell.impact_score;
        const color = gridImpactColor(impactScore);
        const half = GRID_CELL_SIZE / 2;

        // Build cell polygon in GeoJSON [lon, lat] order
        const cellCoords = [
          [cell.lon - half, cell.lat - half],
          [cell.lon + half, cell.lat - half],
          [cell.lon + half, cell.lat + half],
          [cell.lon - half, cell.lat + half],
          [cell.lon - half, cell.lat - half]
        ];
        const cellPoly = turf.polygon([cellCoords]);
        const lakePoly = getTurfLakePolygon();
        if (!lakePoly) return;

        // Clip cell to lake boundary
        const clipped = turf.intersect(cellPoly, lakePoly);
        if (!clipped) return;  // cell entirely outside lake

        // Convert GeoJSON [lon, lat] back to Leaflet [lat, lon]
        const leafletCoords = clipped.geometry.coordinates[0].map(c => [c[1], c[0]]);

        const poly = L.polygon(leafletCoords, {
          color: color,
          weight: 0.5,
          opacity: 0.6,
          fillColor: color,
          fillOpacity: 0.55,
          smoothFactor: 0
        }).addTo(map);

        const tipText = '<strong>Fetch:</strong> ' + ((cell.fetch_km || 0) * 0.621371).toFixed(2) + ' mi<br>' +
                  '<strong>Wave:</strong> ' + ((cell.wave_height_m || 0) * 3.28084).toFixed(1) + ' ft<br>' +
                  '<strong>Impact:</strong> ' + ((cell.impact_score || 0) * 100).toFixed(0) + '%';
        let finalTip = tipText;
        if (cell.shield_factor != null && cell.shield_factor < 0.99) {
          finalTip += '<br><strong>Shield:</strong> ' + (cell.shield_factor * 100).toFixed(0) + '%';
        }
        if (cell.shore_distance_m != null && cell.shore_distance_m < 150) {
          finalTip += '<br><strong>Shore:</strong> ' + (cell.shore_distance_m * 3.28084).toFixed(0) + ' ft';
        }
        poly.bindTooltip(finalTip,
          { direction: 'top', className: 'grid-tooltip', sticky: true }
        );

        poly.on('click', function() {
          if (selectedCell && selectedCell !== this) {
            selectedCell.setStyle({weight: 0.5, opacity: 0.6, fillOpacity: 0.55});
          }
          this.setStyle({weight: 3, opacity: 1.0, fillOpacity: 0.65});
          this.bringToFront();
          this.openTooltip();
          selectedCell = this;
        });

        gridHeatmapLayers.push(poly);
      });
    }

    // ── Update wind UI ──
    function updateWindUI(wind) {
      if (!wind) {
        $impactBadge.textContent = '—';
        $windCard.style.display = 'none';
        return;
      }

      // Determine overall impact for badge
      const speeds = (data.shoreline_segments || []).map(s => s.impact_score || 0);
      const avgImpact = speeds.length ? speeds.reduce((a, b) => a + b, 0) / speeds.length : 0;
      const cat = classifyImpact(avgImpact);
      $impactBadge.textContent = impactLabel(cat);
      $impactBadge.style.background = impactColor(cat) + '18';
      $impactBadge.style.color = impactColor(cat);

      // Wind card on map
      $windCard.style.display = 'flex';
      $windCardText.textContent = (wind.speed_mph ?? '—') + ' mph from ' + (wind.direction_deg ?? '—') + '°';
      $windArrow.style.transform = 'rotate(' + ((wind.direction_deg || 0) - 180) + 'deg)';
    }

    // Full pill label: "Today 8:00 PM", "Tomorrow 7:00 AM", "Sat 8/1 7:00 AM".
    // Every pill gets a day marker so gaps and repeated weekdays never read as
    // out-of-order. Uses the phone's own clock — no hardcoded offsets, DST-safe.
    function pillTimeLabel(f) {
      const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
      const d = new Date(f.timestamp_utc);
      const hour = d.getHours();
      const ampm = hour >= 12 ? 'PM' : 'AM';
      const time = (hour % 12 || 12) + ':00 ' + ampm;
      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const day = new Date(d.getFullYear(), d.getMonth(), d.getDate());
      const diffDays = Math.round((day - today) / 86400000);
      if (diffDays === 0) return 'Today ' + time;
      if (diffDays === 1) return 'Tomorrow ' + time;
      return days[d.getDay()] + ' ' + (d.getMonth() + 1) + '/' + d.getDate() + ' ' + time;
    }

    // ── Build time pills ──
    function buildTimePills(forecast) {
      $timePills.innerHTML = '';

      if (!forecast || forecast.length === 0) {
        const placeholder = document.createElement('span');
        placeholder.className = 'time-pill';
        placeholder.style.opacity = '0.5';
        placeholder.style.pointerEvents = 'none';
        placeholder.textContent = 'No forecast data';
        $timePills.appendChild(placeholder);
        return;
      }

      // Start pills at the entry closest to now — same algorithm as getCurrentWind
      const startIdx = Math.max(0, forecast.indexOf(getCurrentWind(forecast)));

      // Only build pills from startIdx onward (current + future)
      const maxVisible = 10;
      const totalPills = forecast.length - startIdx;
      const showAll = totalPills <= maxVisible;

      const endIdx = showAll ? forecast.length : startIdx + maxVisible;
      for (let i = startIdx; i < endIdx; i++) {
        const f = forecast[i];
        const idx = i;

        const pill = document.createElement('button');
        pill.className = 'time-pill';
        pill.dataset.idx = idx;

        // full label with day marker: "Today 8:00 PM" / "Sat 8/1 7:00 AM"
        const timeStr = pillTimeLabel(f);

        const mphStr = f.speed_mph != null ? f.speed_mph.toFixed(1) : '—';
        pill.innerHTML = timeStr + '<span class="pill-speed">' + mphStr + ' mph · ' + f.direction_deg + '°</span>';
        pill.title = f.timestamp_utc + ' — ' + mphStr + ' mph from ' + f.direction_deg + '°';

        pill.addEventListener('click', () => selectTimeSlot(idx));

        $timePills.appendChild(pill);
      }

      if (!showAll) {
        const moreBtn = document.createElement('button');
        moreBtn.className = 'time-pill';
        moreBtn.style.cssText = 'background:var(--color-primary);color:#fff;font-weight:600;';
        moreBtn.textContent = '+ ' + (totalPills - maxVisible) + ' more';
        moreBtn.addEventListener('click', () => {
          moreBtn.remove();
          for (let i = endIdx; i < forecast.length; i++) {
            const f = forecast[i];
            const idx = i;
            const pill = document.createElement('button');
            pill.className = 'time-pill';
            pill.dataset.idx = idx;
            const timeStr = pillTimeLabel(f);
            const mphStr = f.speed_mph != null ? f.speed_mph.toFixed(1) : '—';
            pill.innerHTML = timeStr + '<span class="pill-speed">' + mphStr + ' mph · ' + f.direction_deg + '°</span>';
            pill.title = f.timestamp_utc + ' — ' + mphStr + ' mph from ' + f.direction_deg + '°';
            pill.addEventListener('click', () => selectTimeSlot(idx));
            $timePills.appendChild(pill);
          }
        });
        $timePills.appendChild(moreBtn);
      }
    }

    // ── Select time slot (with live recompute) ──
    function selectTimeSlot(idx) {
      if (!data || !data.wind_forecast) return;
      currentTimeIdx = idx;

      // Update pills
      const pills = $timePills.querySelectorAll('.time-pill');
      pills.forEach(p => {
        const pIdx = parseInt(p.dataset.idx, 10);
        p.classList.toggle('active', pIdx === idx);
      });

      // Get selected forecast entry
      const forecastEntry = data.wind_forecast[idx];
      if (!forecastEntry) return;

      // Update wind UI
      updateWindUI(forecastEntry);

      // Recompute and redraw shoreline for this hour's wind
      if (data.shoreline_segments) {
        // Shoreline segment impact recomputed for current wind
        // (segments drawn only for debugging — removed for visual clarity)
      }

      // Full redraw of grid heatmap with recomputed impact
      if (data.grid_cells && forecastEntry) {
        redrawGridHeatmap(data.grid_cells, forecastEntry.speed_ms, forecastEntry.direction_deg);
        // Ensure GeoJSON outline stays on top
        addGeoJsonOutline();
      }
    }

    // ── Load manifest ──
    async function loadManifest() {
      try {
        const resp = await fetch('data/lakes/manifest.json');
        if (!resp.ok) throw new Error('Manifest HTTP ' + resp.status);
        manifest = await resp.json();
        if (!manifest || manifest.length === 0) {
          console.warn('Manifest is empty, falling back to hardcoded Blue Lake');
          manifest = null;
          return;
        }
        return manifest;
      } catch (err) {
        console.warn('Could not load lake manifest, using fallback:', err.message);
        manifest = null;
      }
    }

    // ── Switch lake ──
    async function switchLake(lakeId) {
      if (!manifest) return;
      currentLake = manifest.find(function(l) { return l.id === lakeId; });
      if (!currentLake) return;

      // Clear all layers
      clearGridHeatmap();
      if (lakePolygonLayer) map.removeLayer(lakePolygonLayer);
      if (geoJsonOutlineLayer) map.removeLayer(geoJsonOutlineLayer);

      // Recenter map
      map.setView([currentLake.center_lat, currentLake.center_lon], DEFAULT_ZOOM);

      // Reset state and reload
      staticData = null;
      data = null;
      turfLakePolygon = null;  // invalidate Turf cache
      currentTimeIdx = -1;
      $windCard.style.top = '';   // reset to CSS default

      await loadData();

      // Update URL hash
      window.location.hash = 'lake=' + lakeId;

      // Update page title
      document.title = currentLake.name + ' · Wave Forecast';
    }

    // ── Load data (dual-fetch: static geometry + live wind) ──
    async function loadData() {
      $loadingBar.classList.add('visible');
      $loadingSpinner.classList.add('visible');

      try {
        // Fetch static geometry (cached by browser after first load)
        if (!staticData) {
          const staticUrl = getStaticUrl();
          const staticResp = await fetch(staticUrl);
          if (!staticResp.ok) throw new Error('Static data HTTP ' + staticResp.status);
          staticData = await staticResp.json();
        }

        // Fetch live wind from NWS using lake center
        const center = getLakeCenter();
        const forecast = await fetchLakeWind(center[0], center[1]);
        if (!forecast || forecast.length === 0) throw new Error('No wind forecast');

        // Build the combined data object the render pipeline expects
        turfLakePolygon = null;  // invalidate Turf cache
        data = {
          lake_polygon: staticData.lake.polygon,
          grid_cells: staticData.grid,
          shoreline_segments: staticData.shoreline,
          wind_forecast: forecast
        };

        // Recompute impact scores for current wind (first forecast hour)
        const currentWind = getCurrentWind(forecast);
        data.grid_cells = staticData.grid.map(cell => Object.assign({}, cell, {
          impact_score: cellImpact(cell, currentWind.speed_ms, currentWind.direction_deg, data.lake_polygon)
        }));
        data.shoreline_segments = staticData.shoreline.map(seg => Object.assign({}, seg, {
          impact_score: recomputeShorelineImpact(seg, currentWind.direction_deg)
        }));

        // Reset current time index
        currentTimeIdx = 0;

        // Draw lake outline
        if (data.lake_polygon && data.lake_polygon.length > 0) {
          drawLakePolygon(data.lake_polygon);
        }

        // Draw grid heatmap
        redrawGridHeatmap(data.grid_cells, currentWind.speed_ms, currentWind.direction_deg);

        // Add GeoJSON outline layer on top of heatmap
        addGeoJsonOutline();

        // Build time selector
        buildTimePills(data.wind_forecast);

        // Initial time slot — the forecast entry closest to now (same algorithm as
        // getCurrentWind, no separate hour heuristic that can disagree with it)
        if (data.wind_forecast && data.wind_forecast.length > 0) {
          const currentWind = getCurrentWind(data.wind_forecast);
          const currentIdx = data.wind_forecast.indexOf(currentWind);
          selectTimeSlot(currentIdx >= 0 ? currentIdx : 0);

          // Scroll the active pill into view (delay for DOM settle)
          setTimeout(() => {
            const activePill = $timePills.querySelector('.time-pill.active');
            if (activePill) {
              activePill.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
            }
          }, 100);
        } else {
          // No wind forecast data available
          updateWindUI(null);
        }

        $loadingBar.classList.remove('visible');
        $loadingSpinner.classList.remove('visible');

      } catch (err) {
        console.warn('Could not load data:', err.message);
        // Determine failure reason: wind failed vs static data failed
        const reason = staticData ? 'wind' : 'static';
        showNoData(reason);
        $loadingBar.classList.remove('visible');
        $loadingSpinner.classList.remove('visible');
      }
    }

    // ── Show no-data placeholder ──
    function showNoData(reason) {
      // Remove existing overlay if any
      const existing = document.getElementById('noDataOverlay');
      if (existing) existing.remove();

      const isWindError = reason === 'wind';
      const overlay = document.createElement('div');
      overlay.className = 'no-data-overlay absolute inset-0 z-[2000] flex items-center justify-center backdrop-blur bg-bg/90';
      overlay.id = 'noDataOverlay';

      if (isWindError) {
        overlay.innerHTML = '\n        <div class="bg-card border border-border rounded-xl p-10 text-center shadow-lg max-w-[420px]">\n          <div class="w-14 h-14 rounded-full bg-primary/10 flex items-center justify-center mx-auto mb-4 text-2xl text-primary">~</div>\n          <h2 class="font-light text-xl text-ink mb-2">Could not fetch wind data</h2>\n          <p class="text-sm text-muted leading-relaxed">NWS may be unavailable or the<br>network connection was lost.</p>\n          <button id="retryBtn" class="mt-4 font-sans text-sm font-semibold px-6 py-3 min-h-[44px] rounded-full border-2 border-primary bg-transparent text-primary cursor-pointer transition-colors duration-200 hover:bg-primary hover:text-white">Try Again</button>\n        </div>\n      ';
        document.body.appendChild(overlay);
        document.getElementById('retryBtn').addEventListener('click', function() {
          document.getElementById('noDataOverlay').remove();
          loadData();
        });
      } else {
        overlay.innerHTML = '\n        <div class="bg-card border border-border rounded-xl p-10 text-center shadow-lg max-w-[420px]">\n          <div class="w-14 h-14 rounded-full bg-primary/10 flex items-center justify-center mx-auto mb-4 text-2xl text-primary">~</div>\n          <h2 class="font-light text-xl text-ink mb-2">Could not load data</h2>\n          <p class="text-sm text-muted leading-relaxed">Check that the server is running and<br>lake_static.json exists in the data/ folder.<br>Run <code class="font-mono text-xs bg-muted-bg px-1.5 py-0.5 rounded border border-border text-primary">python3 engine/compute_engine.py --static</code></p>\n        </div>\n      ';
        document.body.appendChild(overlay);
      }
    }

    // ── Boot ──
    async function boot() {
      initMap();

      // Swap basemap when theme changes, regardless of how the toggle fired
      new MutationObserver(setBasemap).observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });

      // Load lake manifest
      await loadManifest();

      // Determine current lake from URL hash, query param, or default
      let lakeId = 'blue_lake';
      const hash = window.location.hash;
      const hashMatch = hash.match(/lake=([a-z0-9_-]+)/);
      if (hashMatch) lakeId = hashMatch[1];
      // Also check ?id= query param as fallback
      const search = window.location.search;
      const searchMatch = search.match(/[?&]id=([a-z0-9_-]+)/);
      if (searchMatch) lakeId = searchMatch[1];

      // Set current lake from manifest or fallback
      if (manifest) {
        currentLake = manifest.find(function(l) { return l.id === lakeId; });
        if (!currentLake && manifest.length > 0) {
          currentLake = manifest[0];
          lakeId = currentLake.id;
        }
      }

      // Populate lake selector dropdown
      const $lakeSelect = document.getElementById('lakeSelect');
      if (manifest && manifest.length > 1) {
        manifest.forEach(function(l) {
          const opt = document.createElement('option');
          opt.value = l.id;
          opt.textContent = l.name;
          if (l.id === lakeId) opt.selected = true;
          $lakeSelect.appendChild(opt);
        });
        $lakeSelect.style.display = '';
        $lakeSelect.addEventListener('change', function() {
          switchLake(this.value);
        });
      } else if (manifest && manifest.length === 1) {
        // Single lake: show but disable
        const opt = document.createElement('option');
        opt.value = manifest[0].id;
        opt.textContent = manifest[0].name;
        opt.selected = true;
        $lakeSelect.appendChild(opt);
        $lakeSelect.style.display = '';
      } else {
        // No manifest: hide selector
        $lakeSelect.style.display = 'none';
      }

      // Update title for initial lake
      if (currentLake) {
        document.title = currentLake.name + ' · Wave Forecast';
      }

      document.getElementById('landcoverToggle').addEventListener('click', toggleLandCover);
      document.getElementById('refreshBtn').addEventListener('click', function() {
        staticData = null;  // force re-fetch of static geometry
        loadData();
      });

      // URL hash change handler (browser back/forward)
      window.addEventListener('hashchange', function() {
        const newHash = window.location.hash;
        const m = newHash.match(/lake=([a-z0-9_-]+)/);
        if (m && manifest && currentLake && m[1] !== currentLake.id) {
          switchLake(m[1]);
        }
      });

      // Legend: click title to toggle collapse
      const $legend = document.getElementById('legend');
      const $legendTitle = $legend.querySelector('.legend-title');
      $legendTitle.style.cursor = 'pointer';
      $legendTitle.addEventListener('click', function(e) {
        e.stopPropagation();
        $legend.classList.toggle('collapsed');
      });
      // Default collapsed on mobile
      if (window.innerWidth < 500) {
        $legend.classList.add('collapsed');
      }
      loadData();

      // Register service worker for offline caching
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(function() {});
      }

      // ── PWA install prompt ──
      let deferredPrompt = null;
      const installPrompt = document.getElementById('pwa-install-prompt');
      const installBtn = document.getElementById('pwa-install-btn');
      const dismissBtn = document.getElementById('pwa-dismiss-btn');
      const diagEl = document.getElementById('pwa-diag');

      // Check manifest detection
      if (document.querySelector('link[rel="manifest"]')) {
        diagEl.textContent = '\u2713 manifest linked';
      } else {
        diagEl.textContent = '\u2717 manifest NOT linked';
      }

      // Check SW registration
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.ready.then(function() {
          diagEl.textContent += ' \u00b7 \u2713 SW active';
        }).catch(function() {
          diagEl.textContent += ' \u00b7 \u2717 SW failed';
        });
      } else {
        diagEl.textContent += ' \u00b7 \u2717 no SW support';
      }

      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        deferredPrompt = e;
        installPrompt.style.display = 'block';
        diagEl.textContent += ' \u00b7 \u2713 install prompt available';
      });

      installBtn.addEventListener('click', async function() {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          const result = await deferredPrompt.userChoice;
          diagEl.textContent += ' \u00b7 user: ' + result.outcome;
          deferredPrompt = null;
          installPrompt.style.display = 'none';
        }
      });

      dismissBtn.addEventListener('click', function() {
        installPrompt.style.display = 'none';
      });

      // Fallback: show after 3 seconds if beforeinstallprompt never fired
      setTimeout(function() {
        if (!deferredPrompt && diagEl.textContent.indexOf('install prompt') === -1) {
          diagEl.textContent += ' \u00b7 install prompt never fired';
        }
      }, 3000);
    }

    // Run when DOM is ready
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', boot);
    } else {
      boot();
    }

  })();
  </script>

<!-- PWA Install Diagnostics -->
<div id="pwa-install-prompt" style="display:none; position:fixed; bottom:0; left:0; right:0; z-index:9999; background:var(--color-card); border-top:1px solid var(--color-border); padding:16px 20px; box-shadow:0 10px 15px rgba(0,0,0,0.1); text-align:center;">
  <button id="pwa-install-btn" class="bg-primary text-white border-none px-8 py-3 rounded-full font-sans text-[15px] font-semibold cursor-pointer">Install App</button>
  <button id="pwa-dismiss-btn" class="bg-transparent border-none text-muted px-4 py-2 font-sans text-[13px] cursor-pointer ml-2">Dismiss</button>
  <div id="pwa-diag" class="mt-2 text-[11px] text-muted"></div>
</div>
