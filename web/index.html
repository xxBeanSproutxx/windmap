<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Lake Dashboard · Wave Forecast</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    /* ── Reset & Base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #ffffff;
      --heading: #061b31;
      --accent: #533afd;
      --body: #64748d;
      --border: #e5edf5;
      --card-shadow: 0 2px 12px rgba(50,50,93,0.15);
      --radius: 6px;
      --radius-lg: 10px;
      --font: 'Source Sans 3', system-ui, -apple-system, sans-serif;
      --impact-very-high: #db2777;
      --impact-high: #ea2261;
      --impact-medium: #f59e0b;
      --impact-low: #15be53;
    }

    html, body {
      min-height: 100%;
      font-family: var(--font);
      font-weight: 400;
      color: var(--body);
      background: #f6f8fc;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ── Header ── */
    .header {
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: 0 1px 3px rgba(50,50,93,0.08);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-brand .brand-icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, var(--accent) 0%, #7c6fff 100%);
      border-radius: var(--radius);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      flex-shrink: 0;
    }

    .header-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--heading);
      letter-spacing: -0.01em;
    }

    /* ── Status bar ── */
    .status-bar {
      padding: 10px 20px;
      font-size: 13px;
      color: var(--body);
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
    }

    .status-bar .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .status-bar .dot.loading { background: #f59e0b; animation: pulse 1.5s ease-in-out infinite; }
    .status-bar .dot.ready { background: #15be53; }
    .status-bar .dot.error { background: #ea2261; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* ── Main content ── */
    .main {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      max-width: 640px;
      margin: 0 auto;
    }

    /* ── Lake card ── */
    .lake-card-link {
      text-decoration: none;
      color: inherit;
      display: block;
    }

    .lake-card {
      background: var(--bg);
      border-radius: var(--radius-lg);
      box-shadow: var(--card-shadow);
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      border-left: 4px solid var(--border);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      cursor: default;
    }

    .lake-card:active { transform: scale(0.985); }

    .lake-card.impact-very-high { border-left-color: var(--impact-very-high); }
    .lake-card.impact-high   { border-left-color: var(--impact-high); }
    .lake-card.impact-medium { border-left-color: var(--impact-medium); }
    .lake-card.impact-low    { border-left-color: var(--impact-low); }
    .lake-card.unavailable   { border-left-color: #94a3b8; opacity: 0.7; }

    .lake-card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .lake-name {
      font-size: 18px;
      font-weight: 600;
      color: var(--heading);
      letter-spacing: -0.01em;
    }

    .impact-badge {
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 100px;
      white-space: nowrap;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      flex-shrink: 0;
    }

    .impact-badge.very-high { background: var(--impact-very-high); color: #fff; }
    .impact-badge.high   { background: var(--impact-high); color: #fff; }
    .impact-badge.medium { background: var(--impact-medium); color: #fff; }
    .impact-badge.low    { background: var(--impact-low); color: #fff; }
    .impact-badge.unavailable { background: #94a3b8; color: #fff; }

    .lake-stats {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }

    .stat {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .stat-label {
      font-size: 11px;
      font-weight: 400;
      color: var(--body);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .stat-value {
      font-size: 16px;
      font-weight: 600;
      color: var(--heading);
    }

    .stat-value.small { font-size: 14px; }

    /* ── Sparkline ── */
    .card-sparkline {
      width: 100%;
      height: 35px;
      margin-top: 2px;
    }

    /* ── Loading state ── */
    .skeleton {
      background: var(--bg);
      border-radius: var(--radius-lg);
      box-shadow: var(--card-shadow);
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      border-left: 4px solid var(--border);
    }

    .skeleton-line {
      height: 16px;
      background: linear-gradient(90deg, var(--border) 25%, #f0f3f7 50%, var(--border) 75%);
      background-size: 200% 100%;
      border-radius: 4px;
      animation: shimmer 1.5s ease-in-out infinite;
    }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .skeleton-line.title { width: 60%; height: 20px; }
    .skeleton-line.badge { width: 28%; height: 14px; }
    .skeleton-line.stat  { width: 40%; }

    .skeleton-stats {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }

    /* ── Error / empty state ── */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--body);
    }

    .empty-state h2 {
      font-size: 20px;
      font-weight: 600;
      color: var(--heading);
      margin-bottom: 8px;
    }

    .retry-btn {
      margin-top: 16px;
      padding: 10px 24px;
      font-family: var(--font);
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      background: var(--accent);
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
    }

    .retry-btn:hover { opacity: 0.9; }

    /* ── Rank number ── */
    .rank {
      font-size: 11px;
      font-weight: 600;
      color: var(--body);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* ── Section headers ── */
    .section-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--body);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 0 4px;
      margin-bottom: -6px;
    }
  </style>
</head>
<body>

<header class="header">
  <div class="header-brand">
    <div class="brand-icon">~</div>
    <h1 class="header-title">Lake Dashboard</h1>
  </div>
</header>

<div class="status-bar" id="statusBar">
  <span class="dot loading"></span>
  <span id="statusText">Fetching lake conditions…</span>
</div>

<main class="main" id="lakeList">
  <!-- Skeleton placeholders -->
  <div class="skeleton"><div class="skeleton-line title"></div><div class="skeleton-stats"><div class="skeleton-line stat"></div><div class="skeleton-line stat"></div><div class="skeleton-line stat"></div></div></div>
  <div class="skeleton"><div class="skeleton-line title"></div><div class="skeleton-stats"><div class="skeleton-line stat"></div><div class="skeleton-line stat"></div><div class="skeleton-line stat"></div></div></div>
  <div class="skeleton"><div class="skeleton-line title"></div><div class="skeleton-stats"><div class="skeleton-line stat"></div><div class="skeleton-line stat"></div><div class="skeleton-line stat"></div></div></div>
  <div class="skeleton"><div class="skeleton-line title"></div><div class="skeleton-stats"><div class="skeleton-line stat"></div><div class="skeleton-line stat"></div><div class="skeleton-line stat"></div></div></div>
  <div class="skeleton"><div class="skeleton-line title"></div><div class="skeleton-stats"><div class="skeleton-line stat"></div><div class="skeleton-line stat"></div><div class="skeleton-line stat"></div></div></div>
  <div class="skeleton"><div class="skeleton-line title"></div><div class="skeleton-stats"><div class="skeleton-line stat"></div><div class="skeleton-line stat"></div><div class="skeleton-line stat"></div></div></div>
  <div class="skeleton"><div class="skeleton-line title"></div><div class="skeleton-stats"><div class="skeleton-line stat"></div><div class="skeleton-line stat"></div><div class="skeleton-line stat"></div></div></div>
</main>

<script>
(function() {
  'use strict';

  // ── Constants ──
  const FETCH_CAP_KM = 5.0;
  const GRID_FETCH_CAP_KM = 1.0;
  const SHIELD_DISTANCE_M = 100;
  const HIGH_IMPACT_THRESHOLD = 0.45;
  const NWS_UA = 'blue-lake-wave/1.0';
  const TIMEOUT_MS = 15000;

  // ── DOM refs ──
  const $lakeList = document.getElementById('lakeList');
  const $statusBar = document.getElementById('statusBar');
  const $statusDot = $statusBar.querySelector('.dot');
  const $statusText = document.getElementById('statusText');

  // ── Classification ──
  function classifyImpact(highPct) {
    if (highPct == null || isNaN(highPct)) return 'low';
    if (highPct >= 0.75) return 'very-high';
    if (highPct >= 0.50) return 'high';
    if (highPct >= 0.25) return 'medium';
    return 'low';
  }

  function impactLabel(category) {
    const labels = { 'very-high': 'Very High', high: 'High Impact', medium: 'Moderate', low: 'Low' };
    return labels[category] || 'Low';
  }

  // ── Grid impact color (matches lake.html gridImpactColor) ──
  function lerpColor(a, b, t) {
    return [
      Math.round(a[0] + (b[0] - a[0]) * t),
      Math.round(a[1] + (b[1] - a[1]) * t),
      Math.round(a[2] + (b[2] - a[2]) * t)
    ];
  }

  function gridImpactColor(score) {
    const anchors = [
      { score: 0.00, rgb: [0x10, 0xb9, 0x81] },
      { score: 0.35, rgb: [0xea, 0xb3, 0x08] },
      { score: 0.45, rgb: [0xf9, 0x73, 0x16] },
      { score: 0.60, rgb: [0xef, 0x44, 0x44] },
      { score: 0.80, rgb: [0xdb, 0x27, 0x77] }
    ];
    if (score <= anchors[0].score) {
      const c = anchors[0].rgb;
      return '#' + c.map(v => v.toString(16).padStart(2, '0')).join('');
    }
    if (score >= anchors[anchors.length - 1].score) {
      const c = anchors[anchors.length - 1].rgb;
      return '#' + c.map(v => v.toString(16).padStart(2, '0')).join('');
    }
    for (let i = 0; i < anchors.length - 1; i++) {
      if (score >= anchors[i].score && score <= anchors[i + 1].score) {
        const t = (score - anchors[i].score) / (anchors[i + 1].score - anchors[i].score);
        const lerp = lerpColor(anchors[i].rgb, anchors[i + 1].rgb, t);
        return '#' + lerp.map(v => v.toString(16).padStart(2, '0')).join('');
      }
    }
    return '#10b981';
  }

  // ── Directional fetch ──
  function computeDirectionalFetch(lat, lon, windDirDeg, polygon) {
    if (!polygon || polygon.length < 3) return FETCH_CAP_KM;

    const rad = windDirDeg * Math.PI / 180;
    const kmPerDegLat = 111.32;
    const kmPerDegLon = 111.32 * Math.cos(lat * Math.PI / 180);

    const rdx = Math.sin(rad);
    const rdy = Math.cos(rad);

    let minDistKm = Infinity;

    for (let i = 0; i < polygon.length; i++) {
      const j = (i + 1) % polygon.length;
      const x1 = (polygon[i][0] - lon) * kmPerDegLon;
      const y1 = (polygon[i][1] - lat) * kmPerDegLat;
      const x2 = (polygon[j][0] - lon) * kmPerDegLon;
      const y2 = (polygon[j][1] - lat) * kmPerDegLat;

      const sx = x2 - x1;
      const sy = y2 - y1;

      const denom = rdx * sy - rdy * sx;
      if (Math.abs(denom) < 1e-12) continue;

      const t = (x1 * sy - y1 * sx) / denom;
      const u = (x1 * rdy - y1 * rdx) / denom;

      if (t > 0 && u >= 0 && u <= 1) {
        if (t < minDistKm) minDistKm = t;
      }
    }

    return minDistKm < Infinity ? minDistKm : FETCH_CAP_KM;
  }

  // ── Shield factor (mirrors lake.html computeShieldFactorJS) ──
  function computeShieldFactor(distanceM, waterNormalDeg, windDirDeg, nlcdReduction) {
    if (distanceM == null || distanceM >= SHIELD_DISTANCE_M) return 1.0;

    const windToDeg = (windDirDeg + 180) % 360;
    let diff = Math.abs(windToDeg - waterNormalDeg);
    if (diff > 180) diff = 360 - diff;

    if (diff < 90) {
      const shoreShield = 1.0 - (nlcdReduction != null ? nlcdReduction : 0.5);
      return shoreShield + (1.0 - shoreShield) * (distanceM / SHIELD_DISTANCE_M);
    }
    return 1.0;
  }

  // ── Per-cell impact score ──
  function cellImpact(cell, windSpeedMs, windDirDeg, polygon) {
    const shieldFactor = computeShieldFactor(
      cell.shore_distance_m, cell.shore_normal_deg, windDirDeg,
      cell.nlcd_reduction != null ? cell.nlcd_reduction : 0.5
    );
    const effectiveWind = windSpeedMs * shieldFactor;
    const windFactor = effectiveWind / 7.82;
    const fetchKm = computeDirectionalFetch(cell.lat, cell.lon, windDirDeg, polygon);
    return Math.min(fetchKm / GRID_FETCH_CAP_KM, 1.0) * windFactor;
  }

  // ── Aggregate score from grid cells ──
  function computeAggregateImpact(gridCells, windSpeedMs, windDirDeg, polygon) {
    if (!gridCells || gridCells.length === 0) return { highPct: 0, avgImpact: 0, coverPct: 0 };

    let highCount = 0;
    let totalImpact = 0;

    for (const cell of gridCells) {
      const impact = cellImpact(cell, windSpeedMs, windDirDeg, polygon);
      totalImpact += impact;
      if (impact >= HIGH_IMPACT_THRESHOLD) highCount++;
    }

    return {
      highPct: highCount / gridCells.length,
      avgImpact: totalImpact / gridCells.length,
      coverPct: highCount / gridCells.length
    };
  }

  // ── NWS wind fetch — returns FULL forecast array ──
  async function fetchLakeWind(lat, lon) {
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), TIMEOUT_MS);

    try {
      const pointsUrl = 'https://api.weather.gov/points/' + lat.toFixed(4) + ',' + lon.toFixed(4);
      const pointsResp = await fetch(pointsUrl, {
        signal: controller.signal,
        headers: { 'User-Agent': NWS_UA }
      });
      if (!pointsResp.ok) throw new Error('NWS points HTTP ' + pointsResp.status);

      const pointsData = await pointsResp.json();
      const gridpointUrl = pointsData.properties.forecast.replace('/forecast', '');
      const stationsUrl = pointsData.properties.observationStations;

      const gridResp = await fetch(gridpointUrl, {
        signal: controller.signal,
        headers: { 'User-Agent': NWS_UA }
      });
      if (!gridResp.ok) throw new Error('NWS gridpoint HTTP ' + gridResp.status);

      const raw = await gridResp.json();
      const props = raw.properties;
      if (!props || !props.windSpeed || !props.windDirection) {
        throw new Error('NWS gridpoint missing wind data');
      }

      const parseTime = (vt) => vt.split('/')[0];
      const speedMap = {};
      for (const entry of props.windSpeed.values) {
        speedMap[parseTime(entry.validTime)] = entry.value;
      }
      const dirMap = {};
      for (const entry of props.windDirection.values) {
        dirMap[parseTime(entry.validTime)] = entry.value;
      }

      const times = Object.keys(speedMap).filter(t => t in dirMap).sort();
      if (times.length === 0) throw new Error('No overlapping wind speed+direction entries');

      // Station obs override for current hour
      let stationSpeedKmh = null;
      let stationDirDeg = null;

      if (stationsUrl) {
        try {
          const stationResp = await fetch(stationsUrl, {
            signal: controller.signal,
            headers: { 'User-Agent': NWS_UA }
          });
          if (stationResp.ok) {
            const stationList = await stationResp.json();
            const stations = stationList.observationStations || [];
            if (stations.length > 0) {
              const obsResp = await fetch(stations[0] + '/observations/latest', {
                signal: controller.signal,
                headers: { 'User-Agent': NWS_UA }
              });
              if (obsResp.ok) {
                const sd = await obsResp.json();
                const sp = sd.properties;
                if (sp && sp.windSpeed && sp.windDirection) {
                  stationSpeedKmh = sp.windSpeed.value;
                  stationDirDeg = sp.windDirection.value;
                }
              }
            }
          }
        } catch (e) {
          console.warn('Station obs failed, using gridpoint:', e.message);
        }
      }

      const KMH_TO_MS = 1.0 / 3.6;
      const KMH_TO_MPH = 0.6214;
      const forecast = [];

      for (let i = 0; i < times.length; i++) {
        const utcIso = times[i];
        let speedKmh = speedMap[utcIso];
        let dirDeg = dirMap[utcIso];

        if (i === 0 && stationSpeedKmh != null) {
          speedKmh = stationSpeedKmh;
          dirDeg = stationDirDeg;
        }

        forecast.push({
          timestamp: utcIso,
          speed_ms: Math.round(speedKmh * KMH_TO_MS * 100) / 100,
          speed_mph: Math.round(speedKmh * KMH_TO_MPH * 10) / 10,
          direction_deg: dirDeg
        });
      }

      return forecast;
    } catch (err) {
      if (err.name === 'AbortError') throw new Error('Timed out');
      throw err;
    } finally {
      clearTimeout(timeout);
    }
  }

  // ── Fetch lake static data ──
  async function fetchLakeStatic(lakeId) {
    const url = 'data/lakes/' + lakeId + '/lake_static.json';
    const resp = await fetch(url);
    if (!resp.ok) throw new Error('Static data HTTP ' + resp.status);
    const json = await resp.json();
    return {
      polygon: json.lake.polygon,
      grid_cells: json.grid || []
    };
  }

  // ── Past wind history (localStorage) ──
  function loadWindHistory() {
    try {
      const raw = localStorage.getItem('wind_history');
      return raw ? JSON.parse(raw) : {};
    } catch (e) {
      return {};
    }
  }

  function saveWindHistory(history) {
    try {
      localStorage.setItem('wind_history', JSON.stringify(history));
    } catch (e) {
      // Storage full or unavailable
    }
  }

  function recordWindHistory(lakeId, wind) {
    const history = loadWindHistory();
    if (!history[lakeId]) history[lakeId] = [];

    // Only add if timestamp is different from last entry
    const entries = history[lakeId];
    if (entries.length === 0 || entries[entries.length - 1].timestamp !== wind.timestamp) {
      entries.push({
        timestamp: wind.timestamp,
        speed_mph: wind.speed_mph,
        direction_deg: wind.direction_deg
      });
      // Keep last 24 entries
      if (entries.length > 24) entries.shift();
    }

    saveWindHistory(history);
  }

  // ── Sparkline SVG ──
  function renderSparkline(forecast, lakeId) {
    if (!forecast || forecast.length < 2) return '';

    const history = loadWindHistory();
    const pastEntries = (history[lakeId] || []).slice(-4);

    // Build combined data: past (up to 4) + forecast (up to 20)
    const pastPoints = pastEntries.map(e => ({
      speed_mph: e.speed_mph,
      isPast: true
    }));

    const forecastPoints = forecast.slice(0, 20).map(f => ({
      speed_mph: f.speed_mph,
      isPast: false
    }));

    const allPoints = pastPoints.concat(forecastPoints);
    if (allPoints.length < 2) return '';

    const speeds = allPoints.map(p => p.speed_mph);
    const minSpeed = Math.min.apply(null, speeds);
    const maxSpeed = Math.max.apply(null, speeds);
    const range = maxSpeed - minSpeed || 1;

    const width = 200;
    const height = 35;
    const padY = 5;

    // Scale X positions: past points condensed to left 20%, forecast fills rest
    const forecastCount = forecastPoints.length || 1;
    const pastCount = pastPoints.length;

    // Allocate width: past gets up to 20% of width, forecast gets the rest
    const pastWidth = pastCount > 0 ? width * 0.20 : 0;
    const forecastWidth = width - pastWidth;

    let pointsStr = '';
    let fillPts = '';
    const pastXStep = pastCount > 1 ? pastWidth / (pastCount - 1) : pastWidth / 2;
    const forecastXStep = forecastCount > 1 ? forecastWidth / (forecastCount - 1) : forecastWidth / 2;

    for (let i = 0; i < allPoints.length; i++) {
      let x;
      if (i < pastCount) {
        x = i * pastXStep;
      } else {
        x = pastWidth + (i - pastCount) * forecastXStep;
      }
      const y = height - padY - ((allPoints[i].speed_mph - minSpeed) / range) * (height - 2 * padY);
      pointsStr += (i > 0 ? ' ' : '') + x.toFixed(1) + ',' + y.toFixed(1);
    }

    // Fill polygon
    fillPts = pointsStr + ' ' + width.toFixed(1) + ',' + (height - padY).toFixed(1) + ' 0,' + (height - padY).toFixed(1);

    let svg = '<svg class="card-sparkline" viewBox="0 0 ' + width + ' ' + height + '" preserveAspectRatio="none">';

    // Fill
    svg += '<defs><linearGradient id="sparkGrad_' + lakeId + '" x1="0" y1="0" x2="0" y2="1">';
    svg += '<stop offset="0%" stop-color="#533afd" stop-opacity="0.10"/>';
    svg += '<stop offset="100%" stop-color="#533afd" stop-opacity="0.01"/>';
    svg += '</linearGradient></defs>';

    svg += '<polygon points="' + fillPts + '" fill="url(#sparkGrad_' + lakeId + ')"/>';

    // Line
    svg += '<polyline points="' + pointsStr + '" fill="none" stroke="#533afd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>';

    // Current hour dot (first forecast point)
    if (forecastPoints.length > 0) {
      const dotIdx = pastCount;
      let dotX;
      if (dotIdx < pastCount) {
        dotX = dotIdx * pastXStep;
      } else {
        dotX = pastWidth + (dotIdx - pastCount) * forecastXStep;
      }
      const dotY = height - padY - ((allPoints[dotIdx].speed_mph - minSpeed) / range) * (height - 2 * padY);
      svg += '<circle cx="' + dotX.toFixed(1) + '" cy="' + dotY.toFixed(1) + '" r="4" fill="#533afd"/>';
    }

    svg += '</svg>';
    return svg;
  }

  // ── Card HTML ──
  function renderLakeCard(lake, result, rank, forecast, lakeId) {
    const name = lake.name;
    let cardClass, badgeClass, badgeText, speedStr, coverStr, impactStr;
    const sparklineSvg = renderSparkline(forecast, lakeId);

    if (result.error) {
      cardClass = 'unavailable';
      badgeClass = 'unavailable';
      badgeText = 'Unavailable';
      speedStr = '—';
      coverStr = '—';
      impactStr = result.error;
    } else {
      const cat = classifyImpact(result.highPct);
      cardClass = 'impact-' + cat;
      badgeClass = cat;
      badgeText = impactLabel(cat);
      speedStr = result.speed_mph.toFixed(1) + ' mph';
      coverStr = (result.highPct * 100).toFixed(0) + '%';
      impactStr = (result.avgImpact * 100).toFixed(0) + '%';
    }

    return '<a href="lake.html?id=' + lake.id + '" class="lake-card-link">' +
      '<div class="lake-card ' + cardClass + '">' +
      '<div class="lake-card-top">' +
        '<div>' +
          '<div class="rank">#' + rank + '</div>' +
          '<div class="lake-name">' + name + '</div>' +
        '</div>' +
        '<span class="impact-badge ' + badgeClass + '">' + badgeText + '</span>' +
      '</div>' +
      '<div class="lake-stats">' +
        '<div class="stat">' +
          '<span class="stat-label">Wind</span>' +
          '<span class="stat-value small">' + speedStr + '</span>' +
        '</div>' +
        '<div class="stat">' +
          '<span class="stat-label">Cover</span>' +
          '<span class="stat-value small">' + coverStr + '</span>' +
        '</div>' +
        '<div class="stat">' +
          '<span class="stat-label">Impact</span>' +
          '<span class="stat-value small">' + impactStr + '</span>' +
        '</div>' +
      '</div>' +
      sparklineSvg +
    '</div></a>';
  }

  // ── Fetch all lake data in parallel ──
  async function loadAllLakes(manifest) {
    const lakes = manifest;

    const promises = lakes.map(async (lake) => {
      try {
        const [forecast, staticData] = await Promise.all([
          fetchLakeWind(lake.center_lat, lake.center_lon),
          fetchLakeStatic(lake.id)
        ]);

        const currentWind = forecast[0];

        // Compute aggregate impact from ALL grid cells
        const agg = computeAggregateImpact(
          staticData.grid_cells,
          currentWind.speed_ms,
          currentWind.direction_deg,
          staticData.polygon
        );

        // Record wind history for sparkline
        recordWindHistory(lake.id, currentWind);

        return {
          lake,
          speed_mph: currentWind.speed_mph,
          direction_deg: currentWind.direction_deg,
          highPct: agg.highPct,
          avgImpact: agg.avgImpact,
          forecast: forecast,
          error: null
        };
      } catch (err) {
        console.error('Failed to load ' + lake.name + ':', err.message);
        return {
          lake,
          speed_mph: null,
          direction_deg: null,
          highPct: null,
          avgImpact: null,
          forecast: null,
          error: err.message
        };
      }
    });

    return Promise.all(promises);
  }

  // ── Render ──
  function render(results) {
    const sorted = [...results].sort((a, b) => {
      if (a.error && b.error) return 0;
      if (a.error) return 1;
      if (b.error) return -1;
      return a.highPct - b.highPct;
    });

    const successCount = sorted.filter(r => !r.error).length;

    $statusDot.className = 'dot ' + (successCount > 0 ? 'ready' : 'error');
    $statusText.textContent = successCount + ' of ' + sorted.length + ' lakes loaded';

    let html = '';
    let currentCat = null;
    let successRank = 0;

    for (const r of sorted) {
      if (!r.error) {
        successRank++;
        const cat = classifyImpact(r.highPct);
        if (cat !== currentCat) {
          currentCat = cat;
          html += '<div class="section-label">' + impactLabel(cat) + '</div>';
        }
      } else {
        if (currentCat !== 'unavailable') {
          currentCat = 'unavailable';
          html += '<div class="section-label">Unavailable</div>';
        }
      }
      html += renderLakeCard(r.lake, r, r.error ? '—' : successRank, r.forecast, r.lake.id);
    }

    $lakeList.innerHTML = html;
  }

  // ── Show error state ──
  function showError(msg) {
    $statusDot.className = 'dot error';
    $statusText.textContent = 'Failed to load';
    $lakeList.innerHTML =
      '<div class="empty-state">' +
        '<h2>Could not load lakes</h2>' +
        '<p>' + msg + '</p>' +
        '<button class="retry-btn" onclick="location.reload()">Retry</button>' +
      '</div>';
  }

  // ── Main ──
  async function main() {
    try {
      const manifestResp = await fetch('data/lakes/manifest.json');
      if (!manifestResp.ok) throw new Error('Manifest HTTP ' + manifestResp.status);
      const manifest = await manifestResp.json();

      if (!manifest || manifest.length === 0) {
        showError('No lakes found in manifest.');
        return;
      }

      $statusText.textContent = 'Loading ' + manifest.length + ' lakes…';

      const results = await loadAllLakes(manifest);
      render(results);
    } catch (err) {
      console.error('Dashboard init error:', err);
      showError(err.message);
    }
  }

  main();
})();
</script>

</html>
