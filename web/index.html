<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Lake Dashboard · Wave Forecast</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    /* ── Reset & Base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      /* Design tokens — dark mode */
      --bg: #0b1220;                 /* page — deep slate-navy */
      --surface: #141d30;            /* cards */
      --surface-2: #1b2740;          /* raised */
      --border: rgba(255,255,255,0.08);
      --text: #e6edf7;
      --text-muted: #8ea0b8;
      --accent: #533afd;
      --accent-light: #7c6fff;
      --radius: 12px;
      --radius-lg: 16px;
      --radius-pill: 999px;
      --shadow: 0 4px 24px rgba(2, 6, 18, 0.4);
      --shadow-lg: 0 12px 40px rgba(2, 6, 18, 0.5);
      --font: 'Source Sans 3', system-ui, -apple-system, sans-serif;
      --impact-very-high: #db2777;
      --impact-high: #ea2261;
      --impact-medium: #f59e0b;
      --impact-low: #15be53;
      /* Legacy aliases */
      --heading: var(--text);
      --body: var(--text-muted);
      --card-shadow: var(--shadow);
      --card-shadow-lg: var(--shadow-lg);

      color-scheme: dark;
    }

    html, body {
      min-height: 100%;
      font-family: var(--font);
      font-weight: 400;
      color: var(--text);
      background: var(--bg);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ── Header (glassy, sticky) ── */
    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(11, 18, 32, 0.72);
      -webkit-backdrop-filter: blur(12px) saturate(140%);
      backdrop-filter: blur(12px) saturate(140%);
      border-bottom: 1px solid var(--border);
      padding: calc(12px + env(safe-area-inset-top, 0px)) 20px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: 0 8px 24px rgba(2, 6, 18, 0.3);
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-brand .brand-icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-light) 100%);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      flex-shrink: 0;
      box-shadow: 0 4px 14px rgba(83, 58, 253, 0.35);
    }

    .header-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: -0.01em;
    }

    /* ── Status bar ── */
    .status-bar {
      padding: 10px 20px;
      font-size: 13px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    .status-bar .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .status-bar .dot.loading { background: var(--impact-medium); animation: pulse 1.5s ease-in-out infinite; }
    .status-bar .dot.ready { background: var(--impact-low); }
    .status-bar .dot.error { background: var(--impact-high); }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* ── Main content ── */
    .main {
      padding: 16px 16px calc(24px + env(safe-area-inset-bottom, 0px));
      display: flex;
      flex-direction: column;
      gap: 14px;
      max-width: 640px;
      margin: 0 auto;
    }

    /* ── Lake card ── */
    .lake-card-link {
      text-decoration: none;
      color: inherit;
      display: block;
    }

    .lake-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      padding: 0;
      display: flex;
      flex-direction: row;
      align-items: stretch;
      border-left: 4px solid var(--border);
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
      cursor: pointer;
      overflow: hidden;
    }

    @media (hover: hover) and (pointer: fine) {
      .lake-card:hover {
        transform: translateY(-2px);
        box-shadow: var(--shadow-lg);
        border-color: rgba(124, 111, 255, 0.4);
      }
    }

    .lake-card:active { transform: scale(0.985); }

    .lake-card.impact-very-high { border-left-color: var(--impact-very-high); }
    .lake-card.impact-high   { border-left-color: var(--impact-high); }
    .lake-card.impact-medium { border-left-color: var(--impact-medium); }
    .lake-card.impact-low    { border-left-color: var(--impact-low); }
    .lake-card.unavailable   { border-left-color: #4b5a70; opacity: 0.75; }

    .lake-card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .card-thumb {
      width: 90px;
      flex-shrink: 0;
      align-self: stretch;
      background: linear-gradient(165deg, #17243d 0%, #0e1930 55%, #0a1224 100%);
      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;
      border-right: 1px solid var(--border);
      border-radius: var(--radius-lg) 0 0 var(--radius-lg);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .card-thumb svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .card-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 18px;
      min-width: 0;
    }

    .lake-name {
      font-size: 18px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: -0.01em;
    }

    .impact-badge {
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: var(--radius-pill);
      white-space: nowrap;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      flex-shrink: 0;
    }

    .impact-badge.very-high { background: var(--impact-very-high); color: #fff; }
    .impact-badge.high   { background: var(--impact-high); color: #fff; }
    .impact-badge.medium { background: var(--impact-medium); color: #fff; }
    .impact-badge.low    { background: var(--impact-low); color: #fff; }
    .impact-badge.unavailable { background: #4b5a70; color: #fff; }

    .lake-stats {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }

    .stat {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .stat-label {
      font-size: 11px;
      font-weight: 400;
      color: var(--text-muted);
      letter-spacing: 0.02em;
    }

    .stat-value {
      font-size: 16px;
      font-weight: 600;
      color: var(--text);
    }

    .stat-value.small { font-size: 14px; }

    /* ── Loading state ── */
    .skeleton {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      border-left: 4px solid var(--border);
    }

    .skeleton-line {
      height: 16px;
      background: linear-gradient(90deg, #1b2740 25%, #22314f 50%, #1b2740 75%);
      background-size: 200% 100%;
      border-radius: 4px;
      animation: shimmer 1.5s ease-in-out infinite;
    }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .skeleton-line.title { width: 60%; height: 20px; }
    .skeleton-line.badge { width: 28%; height: 14px; }
    .skeleton-line.stat  { width: 40%; }

    .skeleton-stats {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }

    /* ── Error / empty state ── */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }

    .empty-state h2 {
      font-size: 20px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 8px;
    }

    .retry-btn {
      margin-top: 16px;
      padding: 12px 28px;
      min-height: 44px;
      font-family: var(--font);
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      background: var(--accent);
      border: none;
      border-radius: var(--radius-pill);
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(83, 58, 253, 0.35);
    }

    .retry-btn:hover { opacity: 0.92; }

    /* ── Rank number ── */
    .rank {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

  </style>
</head>
<body>

<header class="header">
  <div class="header-brand">
    <div class="brand-icon"><svg width="16" height="12" viewBox="0 0 16 12"><path d="M0 6c2-3 4 3 6 0s4-3 6 0 4 3 4 0" stroke="white" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg></div>
    <h1 class="header-title">Lake Dashboard</h1>
  </div>
</header>

<div class="status-bar" id="statusBar">
  <span class="dot loading"></span>
  <span id="statusText">Fetching lake conditions…</span>
</div>

<main class="main" id="lakeList">
  <!-- Skeleton placeholders -->
  <div class="skeleton"><div class="skeleton-line title"></div><div class="skeleton-stats"><div class="skeleton-line stat"></div><div class="skeleton-line stat"></div><div class="skeleton-line stat"></div></div></div>
  <div class="skeleton"><div class="skeleton-line title"></div><div class="skeleton-stats"><div class="skeleton-line stat"></div><div class="skeleton-line stat"></div><div class="skeleton-line stat"></div></div></div>
  <div class="skeleton"><div class="skeleton-line title"></div><div class="skeleton-stats"><div class="skeleton-line stat"></div><div class="skeleton-line stat"></div><div class="skeleton-line stat"></div></div></div>
  <div class="skeleton"><div class="skeleton-line title"></div><div class="skeleton-stats"><div class="skeleton-line stat"></div><div class="skeleton-line stat"></div><div class="skeleton-line stat"></div></div></div>
  <div class="skeleton"><div class="skeleton-line title"></div><div class="skeleton-stats"><div class="skeleton-line stat"></div><div class="skeleton-line stat"></div><div class="skeleton-line stat"></div></div></div>
  <div class="skeleton"><div class="skeleton-line title"></div><div class="skeleton-stats"><div class="skeleton-line stat"></div><div class="skeleton-line stat"></div><div class="skeleton-line stat"></div></div></div>
  <div class="skeleton"><div class="skeleton-line title"></div><div class="skeleton-stats"><div class="skeleton-line stat"></div><div class="skeleton-line stat"></div><div class="skeleton-line stat"></div></div></div>
</main>

<script src="js/constants.js"></script>
<script src="js/colors.js"></script>
<script src="js/wind.js"></script>
<script src="js/fetch.js"></script>
<script src="js/main.js"></script>
<script>
(function() {
  'use strict';

  // ── DOM refs ──
  const $lakeList = document.getElementById('lakeList');
  const $statusBar = document.getElementById('statusBar');
  const $statusDot = $statusBar.querySelector('.dot');
  const $statusText = document.getElementById('statusText');

  // ── Classification ──
  function classifyImpact(avgImpact) {
    if (avgImpact == null || isNaN(avgImpact)) return 'low';
    if (avgImpact >= 0.50) return 'very-high';
    if (avgImpact >= 0.30) return 'high';
    if (avgImpact >= 0.15) return 'medium';
    return 'low';
  }

  function impactLabel(category) {
    const labels = { 'very-high': 'Very High', high: 'High', medium: 'Moderate', low: 'Low' };
    return labels[category] || 'Low';
  }

  // ── Fetch lake static data ──
  async function fetchLakeStatic(lakeId) {
    const url = 'data/lakes/' + lakeId + '/lake_static.json';
    const resp = await fetch(url);
    if (!resp.ok) throw new Error('Static data HTTP ' + resp.status);
    const json = await resp.json();
    return {
      polygon: json.lake.polygon,
      grid_cells: json.grid || []
    };
  }

  // ── Card HTML ──
  function renderLakeCard(lake, result, rank, lakeId) {
    const name = lake.name;
    let cardClass, badgeClass, badgeText, speedStr, coverStr, impactStr;

    if (result.error) {
      cardClass = 'unavailable';
      badgeClass = 'unavailable';
      badgeText = 'Unavailable';
      speedStr = '—';
      coverStr = '—';
      impactStr = result.error;
    } else {
      const cat = classifyImpact(result.avgImpact);
      cardClass = 'impact-' + cat;
      badgeClass = cat;
      badgeText = impactLabel(cat);
      speedStr = result.speed_mph.toFixed(1) + ' mph';
      coverStr = (result.highPct * 100).toFixed(0) + '%';
      impactStr = (result.avgImpact * 100).toFixed(0) + '%';
    }

    return '<a href="lake.html#lake=' + lake.id + '" class="lake-card-link">' +
      '<div class="lake-card ' + cardClass + '">' +
        '<div class="card-thumb" data-lake-id="' + lake.id + '"></div>' +
        '<div class="card-body">' +
        '<div class="lake-card-top">' +
          '<div>' +
            '<div class="rank">#' + rank + '</div>' +
            '<div class="lake-name">' + name + '</div>' +
          '</div>' +
          '<span class="impact-badge ' + badgeClass + '">' + badgeText + '</span>' +
        '</div>' +
        '<div class="lake-stats">' +
          '<div class="stat">' +
            '<span class="stat-label">Wind</span>' +
            '<span class="stat-value small">' + speedStr + '</span>' +
          '</div>' +
          '<div class="stat">' +
            '<span class="stat-label">Exposed</span>' +
            '<span class="stat-value small">' + coverStr + '</span>' +
          '</div>' +
          '<div class="stat">' +
            '<span class="stat-label">Impact</span>' +
            '<span class="stat-value small">' + impactStr + '</span>' +
          '</div>' +
        '</div>' +
        '</div>' +
    '</div></a>';
  }

  // ── Fetch all lake data in parallel ──
  async function loadAllLakes(manifest) {
    const lakes = manifest;

    const promises = lakes.map(async (lake) => {
      try {
        const [forecast, staticData] = await Promise.all([
          fetchLakeWind(lake.center_lat, lake.center_lon),
          fetchLakeStatic(lake.id)
        ]);

        const currentWind = getCurrentWind(forecast);

        // Compute aggregate impact from ALL grid cells
        const agg = computeAggregateImpact(
          staticData.grid_cells,
          currentWind.speed_ms,
          currentWind.direction_deg,
          staticData.polygon
        );

        return {
          lake,
          speed_mph: currentWind.speed_mph,
          direction_deg: currentWind.direction_deg,
          highPct: agg.highPct,
          avgImpact: agg.avgImpact,
          error: null
        };
      } catch (err) {
        console.error('Failed to load ' + lake.name + ':', err.message);
        return {
          lake,
          speed_mph: null,
          direction_deg: null,
          highPct: null,
          avgImpact: null,
          error: err.message
        };
      }
    });

    return Promise.all(promises);
  }

  // ── Render ──
  function render(results) {
    const sorted = [...results].sort((a, b) => {
      if (a.error && b.error) return 0;
      if (a.error) return 1;
      if (b.error) return -1;
      return a.avgImpact - b.avgImpact;
    });

    const successCount = sorted.filter(r => !r.error).length;

    $statusDot.className = 'dot ' + (successCount > 0 ? 'ready' : 'error');
    $statusText.textContent = successCount + ' of ' + sorted.length + ' lakes loaded';

    let html = '';
    let successRank = 0;

    for (const r of sorted) {
      if (!r.error) {
        successRank++;
      }
      html += renderLakeCard(r.lake, r, r.error ? '—' : successRank, r.lake.id);
    }

    $lakeList.innerHTML = html;

    // Load GeoJSON outline thumbnails for all cards
    loadOutlineThumbnails();
  }

  // ── Load GeoJSON lake outlines and render as inline SVGs ──
  function loadOutlineThumbnails() {
    const thumbs = $lakeList.querySelectorAll('.card-thumb[data-lake-id]');
    thumbs.forEach(function(thumb) {
      const lakeId = thumb.getAttribute('data-lake-id');
      fetch('data/lakes/' + lakeId + '/outline.geojson')
        .then(function(resp) {
          if (!resp.ok) throw new Error('HTTP ' + resp.status);
          return resp.json();
        })
        .then(function(geojson) {
          renderSvgOutline(thumb, geojson);
        })
        .catch(function(err) {
          console.warn('Outline thumbnail failed for ' + lakeId + ':', err.message);
          // Leave as empty background
        });
    });
  }

  // ── Render a GeoJSON polygon as an inline SVG in a container element ──
  function renderSvgOutline(container, geojson) {
    // Extract all coordinates from the FeatureCollection
    var allCoords = [];
    if (geojson.features && geojson.features.length > 0) {
      var geom = geojson.features[0].geometry;
      if (geom.type === 'Polygon') {
        allCoords = geom.coordinates[0]; // outer ring
      }
    }
    if (allCoords.length === 0) return;

    // Compute bounds
    var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    for (var i = 0; i < allCoords.length; i++) {
      var lon = allCoords[i][0];
      var lat = allCoords[i][1];
      if (lon < minX) minX = lon;
      if (lon > maxX) maxX = lon;
      if (lat < minY) minY = lat;
      if (lat > maxY) maxY = lat;
    }
    var rangeX = maxX - minX || 0.001;
    var rangeY = maxY - minY || 0.001;

    // Determine viewBox aspect — fit landscape or portrait
    var pad = 12; // padding inside SVG
    var vbW = 200, vbH = 300; // portrait to match the original 90px sidebar
    var scaleX = (vbW - 2 * pad) / rangeX;
    var scaleY = (vbH - 2 * pad) / rangeY;
    var scale = Math.min(scaleX, scaleY);
    var offsetX = (vbW - scale * rangeX) / 2;
    var offsetY = (vbH - scale * rangeY) / 2;

    // Build SVG path
    var pathD = '';
    for (var i = 0; i < allCoords.length; i++) {
      var sx = offsetX + (allCoords[i][0] - minX) * scale;
      var sy = vbH - (offsetY + (allCoords[i][1] - minY) * scale); // flip Y
      pathD += (i === 0 ? 'M' : 'L') + sx.toFixed(1) + ',' + sy.toFixed(1);
    }
    pathD += 'Z';

    // Build SVG element
    var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('viewBox', '0 0 ' + vbW + ' ' + vbH);
    svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');

    var path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', pathD);
    path.setAttribute('fill', '#5b9bd5');
    path.setAttribute('stroke', '#3a7cc3');
    path.setAttribute('stroke-width', '1.5');
    path.setAttribute('stroke-linejoin', 'round');

    svg.appendChild(path);
    container.innerHTML = '';
    container.appendChild(svg);
  }

  // ── Show error state ──
  function showError(msg) {
    $statusDot.className = 'dot error';
    $statusText.textContent = 'Failed to load';
    $lakeList.innerHTML =
      '<div class="empty-state">' +
        '<h2>Could not load lakes</h2>' +
        '<p>' + msg + '</p>' +
        '<button class="retry-btn" onclick="location.reload()">Retry</button>' +
      '</div>';
  }

  // ── Main ──
  async function main() {
    try {
      const manifestResp = await fetch('data/lakes/manifest.json');
      if (!manifestResp.ok) throw new Error('Manifest HTTP ' + manifestResp.status);
      const manifest = await manifestResp.json();

      if (!manifest || manifest.length === 0) {
        showError('No lakes found in manifest.');
        return;
      }

      $statusText.textContent = 'Loading ' + manifest.length + ' lakes…';

      const results = await loadAllLakes(manifest);
      render(results);
    } catch (err) {
      console.error('Dashboard init error:', err);
      showError(err.message);
    }
  }

  main();
})();
</script>

<script>navigator.serviceWorker.register('sw.js').catch(function(){});</script>
</body>
</html>
