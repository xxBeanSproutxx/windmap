<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Lake Dashboard · Wave Forecast</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    /* ── Reset & Base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #ffffff;
      --heading: #061b31;
      --accent: #533afd;
      --body: #64748d;
      --border: #e5edf5;
      --card-shadow: 0 2px 12px rgba(50,50,93,0.15);
      --radius: 6px;
      --radius-lg: 10px;
      --font: 'Source Sans 3', system-ui, -apple-system, sans-serif;
      --impact-very-high: #db2777;
      --impact-high: #ea2261;
      --impact-medium: #f59e0b;
      --impact-low: #15be53;
    }

    html, body {
      min-height: 100%;
      font-family: var(--font);
      font-weight: 400;
      color: var(--body);
      background: #f6f8fc;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ── Header ── */
    .header {
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: 0 1px 3px rgba(50,50,93,0.08);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-brand .brand-icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, var(--accent) 0%, #7c6fff 100%);
      border-radius: var(--radius);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      flex-shrink: 0;
    }

    .header-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--heading);
      letter-spacing: -0.01em;
    }

    /* ── Status bar ── */
    .status-bar {
      padding: 10px 20px;
      font-size: 13px;
      color: var(--body);
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
    }

    .status-bar .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .status-bar .dot.loading { background: #f59e0b; animation: pulse 1.5s ease-in-out infinite; }
    .status-bar .dot.ready { background: #15be53; }
    .status-bar .dot.error { background: #ea2261; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* ── Main content ── */
    .main {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      max-width: 640px;
      margin: 0 auto;
    }

    /* ── Lake card ── */
    .lake-card-link {
      text-decoration: none;
      color: inherit;
      display: block;
    }

    .lake-card {
      background: var(--bg);
      border-radius: var(--radius-lg);
      box-shadow: var(--card-shadow);
      padding: 0;
      display: flex;
      flex-direction: row;
      align-items: stretch;
      border-left: 4px solid var(--border);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      cursor: pointer;
      overflow: hidden;
    }

    .lake-card:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(50,50,93,0.2);
    }

    .lake-card:active { transform: scale(0.985); }

    .lake-card.impact-very-high { border-left-color: var(--impact-very-high); }
    .lake-card.impact-high   { border-left-color: var(--impact-high); }
    .lake-card.impact-medium { border-left-color: var(--impact-medium); }
    .lake-card.impact-low    { border-left-color: var(--impact-low); }
    .lake-card.unavailable   { border-left-color: #94a3b8; opacity: 0.7; }

    .lake-card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .card-thumb {
      width: 90px;
      flex-shrink: 0;
      align-self: stretch;
      background-color: #e8edf2;
      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;
      border-radius: var(--radius-lg) 0 0 var(--radius-lg);
    }

    .card-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 18px;
      min-width: 0;
    }

    .lake-name {
      font-size: 18px;
      font-weight: 600;
      color: var(--heading);
      letter-spacing: -0.01em;
    }

    .impact-badge {
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 100px;
      white-space: nowrap;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      flex-shrink: 0;
    }

    .impact-badge.very-high { background: var(--impact-very-high); color: #fff; }
    .impact-badge.high   { background: var(--impact-high); color: #fff; }
    .impact-badge.medium { background: var(--impact-medium); color: #fff; }
    .impact-badge.low    { background: var(--impact-low); color: #fff; }
    .impact-badge.unavailable { background: #94a3b8; color: #fff; }

    .lake-stats {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }

    .stat {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .stat-label {
      font-size: 11px;
      font-weight: 400;
      color: var(--body);
      letter-spacing: 0.02em;
    }

    .stat-value {
      font-size: 16px;
      font-weight: 600;
      color: var(--heading);
    }

    .stat-value.small { font-size: 14px; }

    /* ── Loading state ── */
    .skeleton {
      background: var(--bg);
      border-radius: var(--radius-lg);
      box-shadow: var(--card-shadow);
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      border-left: 4px solid var(--border);
    }

    .skeleton-line {
      height: 16px;
      background: linear-gradient(90deg, var(--border) 25%, #f0f3f7 50%, var(--border) 75%);
      background-size: 200% 100%;
      border-radius: 4px;
      animation: shimmer 1.5s ease-in-out infinite;
    }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .skeleton-line.title { width: 60%; height: 20px; }
    .skeleton-line.badge { width: 28%; height: 14px; }
    .skeleton-line.stat  { width: 40%; }

    .skeleton-stats {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }

    /* ── Error / empty state ── */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--body);
    }

    .empty-state h2 {
      font-size: 20px;
      font-weight: 600;
      color: var(--heading);
      margin-bottom: 8px;
    }

    .retry-btn {
      margin-top: 16px;
      padding: 10px 24px;
      font-family: var(--font);
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      background: var(--accent);
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
    }

    .retry-btn:hover { opacity: 0.9; }

    /* ── Rank number ── */
    .rank {
      font-size: 11px;
      font-weight: 600;
      color: var(--body);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

  </style>
</head>
<body>

<header class="header">
  <div class="header-brand">
    <div class="brand-icon"><svg width="16" height="12" viewBox="0 0 16 12"><path d="M0 6c2-3 4 3 6 0s4-3 6 0 4 3 4 0" stroke="white" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg></div>
    <h1 class="header-title">Lake Dashboard</h1>
  </div>
</header>

<div class="status-bar" id="statusBar">
  <span class="dot loading"></span>
  <span id="statusText">Fetching lake conditions…</span>
</div>

<main class="main" id="lakeList">
  <!-- Skeleton placeholders -->
  <div class="skeleton"><div class="skeleton-line title"></div><div class="skeleton-stats"><div class="skeleton-line stat"></div><div class="skeleton-line stat"></div><div class="skeleton-line stat"></div></div></div>
  <div class="skeleton"><div class="skeleton-line title"></div><div class="skeleton-stats"><div class="skeleton-line stat"></div><div class="skeleton-line stat"></div><div class="skeleton-line stat"></div></div></div>
  <div class="skeleton"><div class="skeleton-line title"></div><div class="skeleton-stats"><div class="skeleton-line stat"></div><div class="skeleton-line stat"></div><div class="skeleton-line stat"></div></div></div>
  <div class="skeleton"><div class="skeleton-line title"></div><div class="skeleton-stats"><div class="skeleton-line stat"></div><div class="skeleton-line stat"></div><div class="skeleton-line stat"></div></div></div>
  <div class="skeleton"><div class="skeleton-line title"></div><div class="skeleton-stats"><div class="skeleton-line stat"></div><div class="skeleton-line stat"></div><div class="skeleton-line stat"></div></div></div>
  <div class="skeleton"><div class="skeleton-line title"></div><div class="skeleton-stats"><div class="skeleton-line stat"></div><div class="skeleton-line stat"></div><div class="skeleton-line stat"></div></div></div>
  <div class="skeleton"><div class="skeleton-line title"></div><div class="skeleton-stats"><div class="skeleton-line stat"></div><div class="skeleton-line stat"></div><div class="skeleton-line stat"></div></div></div>
</main>

<script src="shared.js"></script>
<script>
(function() {
  'use strict';

  // ── DOM refs ──
  const $lakeList = document.getElementById('lakeList');
  const $statusBar = document.getElementById('statusBar');
  const $statusDot = $statusBar.querySelector('.dot');
  const $statusText = document.getElementById('statusText');

  // ── Classification ──
  function classifyImpact(highPct) {
    if (highPct == null || isNaN(highPct)) return 'low';
    if (highPct >= 0.50) return 'very-high';
    if (highPct >= 0.30) return 'high';
    if (highPct >= 0.15) return 'medium';
    return 'low';
  }

  function impactLabel(category) {
    const labels = { 'very-high': 'Very High', high: 'High', medium: 'Moderate', low: 'Low' };
    return labels[category] || 'Low';
  }

  // ── Fetch lake static data ──
  async function fetchLakeStatic(lakeId) {
    const url = 'data/lakes/' + lakeId + '/lake_static.json';
    const resp = await fetch(url);
    if (!resp.ok) throw new Error('Static data HTTP ' + resp.status);
    const json = await resp.json();
    return {
      polygon: json.lake.polygon,
      grid_cells: json.grid || []
    };
  }

  // ── Card HTML ──
  function renderLakeCard(lake, result, rank, lakeId) {
    const name = lake.name;
    let cardClass, badgeClass, badgeText, speedStr, coverStr, impactStr;

    if (result.error) {
      cardClass = 'unavailable';
      badgeClass = 'unavailable';
      badgeText = 'Unavailable';
      speedStr = '—';
      coverStr = '—';
      impactStr = result.error;
    } else {
      const cat = classifyImpact(result.highPct);
      cardClass = 'impact-' + cat;
      badgeClass = cat;
      badgeText = impactLabel(cat);
      speedStr = result.speed_mph.toFixed(1) + ' mph';
      coverStr = (result.highPct * 100).toFixed(0) + '%';
      impactStr = (result.avgImpact * 100).toFixed(0) + '%';
    }

    return '<a href="lake.html#lake=' + lake.id + '" class="lake-card-link">' +
      '<div class="lake-card ' + cardClass + '">' +
        '<div class="card-thumb" style="background-image:url(data/lakes/' + lake.id + '/thumb.png)"></div>' +
        '<div class="card-body">' +
        '<div class="lake-card-top">' +
          '<div>' +
            '<div class="rank">#' + rank + '</div>' +
            '<div class="lake-name">' + name + '</div>' +
          '</div>' +
          '<span class="impact-badge ' + badgeClass + '">' + badgeText + '</span>' +
        '</div>' +
        '<div class="lake-stats">' +
          '<div class="stat">' +
            '<span class="stat-label">Wind</span>' +
            '<span class="stat-value small">' + speedStr + '</span>' +
          '</div>' +
          '<div class="stat">' +
            '<span class="stat-label">Exposed</span>' +
            '<span class="stat-value small">' + coverStr + '</span>' +
          '</div>' +
          '<div class="stat">' +
            '<span class="stat-label">Impact</span>' +
            '<span class="stat-value small">' + impactStr + '</span>' +
          '</div>' +
        '</div>' +
        '</div>' +
    '</div></a>';
  }

  // ── Fetch all lake data in parallel ──
  async function loadAllLakes(manifest) {
    const lakes = manifest;

    const promises = lakes.map(async (lake) => {
      try {
        const [forecast, staticData] = await Promise.all([
          fetchLakeWind(lake.center_lat, lake.center_lon),
          fetchLakeStatic(lake.id)
        ]);

        const currentWind = getCurrentWind(forecast);

        // Compute aggregate impact from ALL grid cells
        const agg = computeAggregateImpact(
          staticData.grid_cells,
          currentWind.speed_ms,
          currentWind.direction_deg,
          staticData.polygon
        );

        return {
          lake,
          speed_mph: currentWind.speed_mph,
          direction_deg: currentWind.direction_deg,
          highPct: agg.highPct,
          avgImpact: agg.avgImpact,
          error: null
        };
      } catch (err) {
        console.error('Failed to load ' + lake.name + ':', err.message);
        return {
          lake,
          speed_mph: null,
          direction_deg: null,
          highPct: null,
          avgImpact: null,
          error: err.message
        };
      }
    });

    return Promise.all(promises);
  }

  // ── Render ──
  function render(results) {
    const sorted = [...results].sort((a, b) => {
      if (a.error && b.error) return 0;
      if (a.error) return 1;
      if (b.error) return -1;
      return a.avgImpact - b.avgImpact;
    });

    const successCount = sorted.filter(r => !r.error).length;

    $statusDot.className = 'dot ' + (successCount > 0 ? 'ready' : 'error');
    $statusText.textContent = successCount + ' of ' + sorted.length + ' lakes loaded';

    let html = '';
    let successRank = 0;

    for (const r of sorted) {
      if (!r.error) {
        successRank++;
      }
      html += renderLakeCard(r.lake, r, r.error ? '—' : successRank, r.lake.id);
    }

    $lakeList.innerHTML = html;
  }

  // ── Show error state ──
  function showError(msg) {
    $statusDot.className = 'dot error';
    $statusText.textContent = 'Failed to load';
    $lakeList.innerHTML =
      '<div class="empty-state">' +
        '<h2>Could not load lakes</h2>' +
        '<p>' + msg + '</p>' +
        '<button class="retry-btn" onclick="location.reload()">Retry</button>' +
      '</div>';
  }

  // ── Main ──
  async function main() {
    try {
      const manifestResp = await fetch('data/lakes/manifest.json');
      if (!manifestResp.ok) throw new Error('Manifest HTTP ' + manifestResp.status);
      const manifest = await manifestResp.json();

      if (!manifest || manifest.length === 0) {
        showError('No lakes found in manifest.');
        return;
      }

      $statusText.textContent = 'Loading ' + manifest.length + ' lakes…';

      const results = await loadAllLakes(manifest);
      render(results);
    } catch (err) {
      console.error('Dashboard init error:', err);
      showError(err.message);
    }
  }

  main();
})();
</script>

</body>
</html>
